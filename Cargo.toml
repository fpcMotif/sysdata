[package]
name = "sysdata"
version = "0.1.0"
edition = "2024"
publish = false

[features]
test-support = ["gpui-kit/test-support"]

[[test]]
name = "ui_flows"
required-features = ["test-support"]

[dependencies]
async-channel = "2"
gpui-kit = "=0.6.6"
libc = "0.2"
objc = "0.2"
raw-window-handle = "0.6"
rayon = "1"
serde_json = "1"

# objc 0.2's msg_send! checks a `cargo-clippy` feature inside this crate.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
